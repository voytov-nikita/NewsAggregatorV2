<app-page-shell class="subs-page">
  <app-page-header pageHeader title="Subscriptions">
    <span pageHeaderMeta class="page-sub">{{ followingCount() }} following</span>
  </app-page-header>

  <div class="body">
  <div class="tabs">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="tab"
        [class.active]="activeTab() === tab.id"
        (click)="setTab(tab.id)">
        {{ tab.label }}
      </button>
    }
  </div>

  <app-search-bar
    [placeholder]="'Search ' + activeTab()"
    (debounced)="onSearch($event)"
  />

  @if (rows().length === 0) {
    <app-empty-state
      glyph="⌕"
      title="No matches"
      description="Nothing matches your search." />
  } @else {
    <ul class="rows">
      @for (row of rows(); track row.key) {
        <li class="row">
          <div class="row-info">
            <span class="row-label">{{ row.label }}</span>
            @if (row.meta) {
              <span class="row-meta">{{ row.meta }}</span>
            }
          </div>
          <button
            type="button"
            class="follow-btn"
            [class.following]="row.following"
            (click)="toggle(row)">
            {{ row.following ? 'Following' : 'Follow' }}
          </button>
        </li>
      }
    </ul>
  }
  </div>
</app-page-shell>
