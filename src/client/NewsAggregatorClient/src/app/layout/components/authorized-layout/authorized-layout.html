<div class="page-wrapper">
  <aside class="sidebar">
    <a [routerLink]="navigation.getNewsListRoute()" class="sidebar-logo">News<br />Aggregator</a>

    <div class="sidebar-section">
      <div class="section-label">Разделы</div>
      <nav class="sidebar-links">
        @for (item of sidebarSections(); track item.label) {
          <a [routerLink]="item.link" class="sidebar-link">{{ item.label }}</a>
        }
      </nav>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Личное</div>
      <nav class="sidebar-links">
        @for (item of sidebarPersonal(); track item.label) {
          <a [routerLink]="item.link" class="sidebar-link">{{ item.label }}</a>
        }
      </nav>
    </div>
  </aside>

  <main class="main-area">
    <router-outlet></router-outlet>
  </main>
</div>
