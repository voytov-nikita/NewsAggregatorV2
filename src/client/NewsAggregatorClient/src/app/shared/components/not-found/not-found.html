<div class="not-found">
  <header class="not-found__header">
    <h1 class="not-found__header-title">Not found</h1>
  </header>
  <div class="not-found__body">
    <div class="not-found__card">
      <div class="not-found__code">404</div>
      <h2 class="not-found__title">Page not found</h2>
      <p class="not-found__description">
        Запрашиваемая страница не существует или была перемещена. Проверьте адрес или вернитесь в ленту.
      </p>
      @if (requestedPath) {
        <div class="not-found__path">{{ requestedPath }}</div>
      }
      <div class="not-found__actions">
        <button type="button" class="not-found__primary" (click)="goHome()">← Back to feed</button>
        <button type="button" class="not-found__secondary" (click)="goBack()">Go back</button>
      </div>
    </div>
  </div>
</div>
