<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="logo-row">
    <button type="button" class="logo-btn" (click)="toggleCollapsed()">
      <div class="logo">NA</div>
      @if (!collapsed()) {
        <span class="brand">NewsAggregator</span>
      }
    </button>
    @if (!collapsed()) {
      <button
        type="button"
        class="theme-btn"
        [title]="themeTitle()"
        (click)="toggleTheme()"
      >
        {{ themeIcon() }}
      </button>
    }
  </div>

  <nav class="nav">
    @for (item of items(); track item.id) {
      <div class="nav-group">
        <a
          class="nav-item"
          [class.active]="isItemActive(item)"
          [class.coming-soon]="item.comingSoon"
          [attr.title]="collapsed() ? item.label : null"
          [routerLink]="item.comingSoon ? null : (item.children ? item.children[0].route : item.route)"
        >
          <span class="icon">{{ item.icon }}</span>
          @if (!collapsed()) {
            <span class="label">{{ item.label }}</span>
            @if (item.comingSoon) {
              <span class="soon-badge">soon</span>
            }
          }
        </a>

        @if (item.children?.length && !collapsed()) {
          <div class="children">
            @for (child of item.children; track child.id) {
              <a
                class="child-item"
                [class.active]="isChildActive(child.id)"
                [routerLink]="child.route"
              >
                {{ child.label }}
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>

  <div class="bottom-slot"></div>
</aside>
