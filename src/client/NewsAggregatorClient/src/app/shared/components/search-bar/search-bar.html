<div class="search-bar">
  <span class="search-icon">⌕</span>
  <input
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    (input)="onInput($any($event.target).value)"
  />
  @if (value()) {
    <button type="button" class="clear-btn" (click)="clear()" aria-label="Clear">×</button>
  }
</div>
