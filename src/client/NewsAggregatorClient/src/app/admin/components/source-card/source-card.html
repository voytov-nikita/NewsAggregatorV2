<article class="src-card">
  <div class="type-badge" [class.html]="source().type === 'HTML'">{{ source().type }}</div>

  <div class="src-body">
    <div class="src-head">
      <span class="src-name">{{ source().name }}</span>
      <span
        class="status"
        [class.active]="source().active"
      >{{ source().active ? 'Active' : 'Paused' }}</span>
    </div>
    <div class="src-url">{{ source().url }}</div>
    <div class="src-stats">
      <span><strong>{{ source().articles }}</strong> articles</span>
      <span class="dot">·</span>
      <span [class.warn]="source().success < 95">{{ source().success }}% success</span>
      <span class="dot">·</span>
      <span>last crawl {{ source().lastCrawl }}</span>
    </div>
  </div>

  <div class="src-actions">
    <button type="button" class="icon-btn" (click)="edit.emit(source())" title="Edit">✎</button>
    <button
      type="button"
      class="icon-btn"
      (click)="toggleActive.emit(source())"
      [title]="source().active ? 'Pause' : 'Resume'"
    >
      {{ source().active ? '⏸' : '▶' }}
    </button>
    <button type="button" class="icon-btn danger" (click)="remove.emit(source())" title="Delete">×</button>
  </div>
</article>
