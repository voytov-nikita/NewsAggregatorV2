<app-page-shell class="sources-page">
  <app-page-header pageHeader title="Sources">
    <span pageHeaderMeta class="page-sub">{{ filtered().length }} configured</span>
    <button pageHeaderActions type="button" class="btn primary" (click)="openWizard()">+ Add source</button>
  </app-page-header>

  <div class="body">
    <div class="toolbar">
      <app-search-bar
        [placeholder]="'Search sources by name or URL'"
        (debounced)="onSearch($event)"
      ></app-search-bar>
    </div>

    @if (paged().length === 0) {
      @if (query()) {
        <app-empty-state
          glyph="⌕"
          title="No matching sources"
          [description]="'Nothing matches “' + query() + '”. Try a different search.'" />
      } @else {
        <app-empty-state
          title="No sources yet"
          description="Add your first RSS source to start crawling news.">
          <button type="button" class="btn primary" (click)="openWizard()">+ Add source</button>
        </app-empty-state>
      }
    } @else {
      <div class="cards">
        @for (s of paged(); track s.id) {
          <app-source-card
            [source]="s"
            (edit)="onEdit($event)"
            (toggleActive)="onToggleActive($event)"
            (remove)="onRemove($event)"
          ></app-source-card>
        }
      </div>
    }
  </div>

  @if (totalPages() > 1) {
    <div pageFooter>
      <app-pager
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [take]="take()"
        (pageChange)="onPageChange($event)"
        (takeChange)="onTakeChange($event)"
      ></app-pager>
    </div>
  }
</app-page-shell>

@if (wizardOpen()) {
  <app-source-wizard
    (cancel)="closeWizard()"
    (create)="onCreate($event)"
  ></app-source-wizard>
}
