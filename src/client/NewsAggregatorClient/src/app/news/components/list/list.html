<header class="masthead">
  <div class="masthead-top">
    <span class="breadcrumb-current">Новости дня</span>
    <div class="masthead-right">
      <a [routerLink]="navigation.getSettingsRoute()" class="icon-button">&#9881;</a>
      <div class="user-circle"></div>
    </div>
  </div>
</header>

<section class="content-area">
  <div class="toolbar">
    <input
      type="text"
      pInputText
      class="search-field"
      placeholder="Поиск новостей..."
      [value]="searchQuery()"
      (input)="onSearchInput($any($event.target).value)"
    />
    <p-button
      icon="pi pi-filter"
      [outlined]="true"
      severity="secondary"
      styleClass="filter-btn"
      (onClick)="filterPopover.toggle($event)"
    />
    <p-popover #filterPopover>
      <p-menu [model]="sortMenuItems()" />
    </p-popover>
  </div>

  <div class="articles">
    @for (article of articles(); track article.id) {
      <article class="article">
        @if (article.imageLink) {
          <img class="article-thumb" [src]="article.imageLink" [alt]="article.title" />
        }
        <div class="article-body">
          <div class="article-head">
            <span class="source-badge">{{ article.publisher }}</span>
            <span class="timestamp">{{ article.publishDate | date: 'dd.MM.yyyy HH:mm' }}</span>
          </div>
          <h2 class="article-headline">{{ article.title }}</h2>
          <div class="article-controls">
            <a class="control-btn primary" [href]="article.originalLink" target="_blank"
              >Читать далее</a
            >
            <button class="control-btn secondary">&#9733; Сохранить</button>
          </div>
        </div>
      </article>
    }
  </div>

  <app-pager
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [take]="pageSize()"
    (pageChange)="setPage($event)"
    (takeChange)="onTakeChange($event)"
  />
</section>
